name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # No CI não existe janela: a variante headless do OpenCV é suficiente
          # e evita arrastar as bibliotecas gráficas do sistema.
          pip install "opencv-python-headless>=4.8,<6" "numpy>=1.24" "mediapipe>=0.10.9"
          pip install pytest ruff

      - name: Lint
        run: ruff check src tests main.py

      - name: Testes
        run: pytest -q

      - name: Execução ponta a ponta (sem webcam)
        run: |
          python main.py --source synthetic --headless --max-frames 30 \
            --mode movimento --record /tmp/demo.mp4
          test -s /tmp/demo.mp4
